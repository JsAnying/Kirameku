name: Build Linux frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-frontend.yml'
      - 'Kirameku/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install --global pnpm@10.34.9
      - name: Install dependencies
        working-directory: Kirameku
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        working-directory: Kirameku
        run: pnpm build
      - name: Package frontend and build output
        run: >-
          tar --exclude='./node_modules' --exclude='./.env' --exclude='./.env.*'
          -czf kirameku-frontend-linux.tar.gz -C Kirameku .
      - uses: actions/upload-artifact@v4
        with:
          name: kirameku-frontend-linux
          path: kirameku-frontend-linux.tar.gz
          if-no-files-found: error
          retention-days: 7

